name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache external ontologies
        uses: actions/cache@v4
        with:
          path: .cache
          key: ontologies-${{ hashFiles('tools/fetch_ontologies.sh') }}
      - run: make install
      - run: make all
